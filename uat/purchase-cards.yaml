# Purchase cards: what each tester enters in the risk check, and the one BNPL limit to record.
#
# The tester plays the persona's student, so nobody types their own limit or needs an account with
# the provider (D-54: synthetic data only). Everything a tester types is on the card: provider,
# item, price, number of instalments and monthly fee. Purchase date is the day they do the test.
#
# `expected_band` is the ANSWER KEY, for us and never for testers: the band the trained model shows
# when the tester has confirmed every suggestion on the Recurring page (the instructed path), on
# the file a tester gets for the 8 November 2026 session (the committed persona file moved forward
# by whole weeks, as `ml.uat.booklet` does) on every day of 8-14 November and for every random seed.
# `ml.uat.purchase_cards --session 2026-11-08` measures it and writes
# `reports/uat/purchase_cards_session_2026-11-08.md`, which lists what both paths give. Not every
# tester will take the instructed path, so that report also shows the path where the suggestions are
# left alone. For another session date, re-measure and re-pin these bands (the tests use 8 November).
# `reports/uat/purchase_cards.md` is the same measurement on the unshifted committed files on
# 25-31 October, kept for reference: it differs where a card sits near a band edge (B1 is Safe there).
#
# Limits are the assumed student medians in ml/datagen/params.yaml (limit_median_sen). How a real
# provider counts its cap is still assumed (D-28).
#
# Fees follow bnpl-billing-rules-my.md: 0% on the short plans used here.

personas:
  frequent_bnpl:
    provider: spaylater
    limit_rm: 1500
    cards:
      - id: F1
        item: Wireless headphones
        price_rm: 600
        instalments: 3
        monthly_fee_pct: 0
        vignette: V1
        expected_band: Safe
      - id: F2
        item: Gaming chair
        price_rm: 1300
        instalments: 3
        monthly_fee_pct: 0
        expected_band: Caution
      - id: F3
        item: Laptop
        price_rm: 2000
        instalments: 3
        monthly_fee_pct: 0
        expected_band: At Risk

  budget_conscious:
